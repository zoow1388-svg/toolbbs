name: Release validation

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-validation.txt
      - name: Install validation dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements-validation.txt
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Verify tag and version
        shell: powershell
        run: |
          $version=(Get-Content 'skill/codex-project-orchestrator/VERSION' -Raw).Trim()
          $expected="v$version"
          if('${{ github.ref_name }}' -ne $expected){throw "Tag does not match VERSION: expected $expected"}
      - name: Run complete validation
        shell: powershell
        run: ./tests/run-validation.ps1 -PythonCommand python
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
      - name: Build verified package
        shell: powershell
        run: ./installer/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP\toolbbs-release"
      - name: Verify package manifest and checksum
        shell: powershell
        run: |
          $version=(Get-Content 'skill/codex-project-orchestrator/VERSION' -Raw).Trim()
          $archive="$env:RUNNER_TEMP\toolbbs-release\codex-project-orchestrator-v$version.zip"
          ./tests/verify-release-package.ps1 -ArchivePath $archive -ChecksumPath "$archive.sha256" -ExpectedVersion $version
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: toolbbs-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}\toolbbs-release\*.zip
            ${{ runner.temp }}\toolbbs-release\*.sha256
          if-no-files-found: error
          retention-days: 14
